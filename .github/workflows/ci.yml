name: CI

# Runs on every pull request into main, a stream's ship pull request and the
# release pull request alike, and on a push to a release/v* branch
# (docs/agents/evidence-standards.md). A red pull request is never merged.
on:
  push:
    branches: ["release/v*"]
  pull_request:
    branches: ["main"]

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
